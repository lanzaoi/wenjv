services:
  wenjv-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
      target: sidecar
    image: wenjv-sidecar:latest
    ports:
      - "8788:8788"
    volumes:
      # Cache downloaded RapidOCR / Pix2Text ONNX weights across restarts
      - sidecar-cache:/home/appuser/.cache
      - sidecar-pix2text:/home/appuser/.pix2text
    restart: unless-stopped

  wenjv-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: wenjv-server:latest
    depends_on:
      - wenjv-sidecar
    ports:
      - "8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      WENJV_BASE_DIR: "/data/wenjv"
      MODELS_DIR: "/app/models"
      OCR_SIDECAR_URL: "http://wenjv-sidecar:8788"
    volumes:
      # Persists wenjv.db, lance_db/, uploads/, wiki_vault/, and reads backend.env
      - ${WENJV_CONFIG_DIR:-${HOME:-~}/.config/wenjv}:/data/wenjv
      # Read-only mount of local ONNX embedding / reranker / SigLIP2 models
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  sidecar-cache:
  sidecar-pix2text:
