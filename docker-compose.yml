services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wenjv-api:latest
    ports:
      - "8000:8000"
    # IMPORTANT: Never hardcode SECRET_KEY or API_KEY in this file or in the Dockerfile.
    # Config is read from the mounted dir's backend.env (not tracked in Git).
    #
    # Host path (left side):
    #   - Default: ~/.config/wenjv  (Windows: %USERPROFILE%\.config\wenjv)
    #   - Legacy data still under inquisitive? set:
    #       WENJV_CONFIG_DIR=%USERPROFILE%\.config\inquisitive
    #     or migrate files into ~/.config/wenjv first.
    # Container path is always /home/appuser/.config/wenjv (matches app primary name).
    volumes:
      - ${WENJV_CONFIG_DIR:-${USERPROFILE:-${HOME:-~}}/.config/wenjv}:/home/appuser/.config/wenjv
    restart: unless-stopped
