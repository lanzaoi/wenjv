[project]
name = "wenjv-ocr-sidecar"
version = "0.1.0"
description = "Local CPU OCR sidecar (PP-OCRv5 Mobile via RapidOCR + Pix2Text formula extraction)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "python-multipart>=0.0.20",
  "pillow>=11.0.0",
  "numpy<2",
  "onnxruntime>=1.20.0",
  "pypdfium2>=5.0.0",
  "rapidocr==3.9.1",
  "pix2text>=1.1.7",
  "optimum>=2.1.0,<2.2.0",
  "optimum-onnx>=0.1.0",
]
